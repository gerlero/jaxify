[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "jaxify"
version = "0.0.5"
description = "Write Python. Run JAX"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.5,<0.12",
    "typing_extensions>=4.1,<5; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/gerlero/jaxify"
Repository = "https://github.com/gerlero/jaxify"

[dependency-groups]
lint = ["ruff>=0.16.5,<0.17"]
typing = ["ty>=0.0.76,<0.1"]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
dev = [
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
]
